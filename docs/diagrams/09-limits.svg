<g class="node" id="n-paused"><rect x="500" y="820" width="260" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="630.0" y="870.6">AWAITING_INPUT</tspan></text></g>
<g class="edge" id="e-l9"><polyline points="630,820 630,760" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="630,760 635.2,770.8 624.8,770.8" fill="#1e1e1e"/></g>
