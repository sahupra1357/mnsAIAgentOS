<g class="edge" id="e-l_resume"><polyline points="250,640 250,375 870,375" fill="none" stroke="#8b5cf6" stroke-width="2"/><polygon points="870,375 859.2,380.2 859.2,369.8" fill="#8b5cf6"/></g>
<text x="40" y="976" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">Settings: [api] rate_limit_*, [[quotas]], [user_quotas], [orchestrator], [interaction] *_timeout_seconds / on_timeout.</tspan></text>
