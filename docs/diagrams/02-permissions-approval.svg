<g class="node" id="n-mode"><rect x="730" y="90" width="200" height="80" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="830.0" y="125.0">2. permission</tspan><tspan x="830.0" y="147.6">mode</tspan></text></g>
<g class="edge" id="e-to_ask"><polyline points="930,130 960,130" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="960,130 949.2,135.2 949.2,124.8" fill="#1e1e1e"/></g>
