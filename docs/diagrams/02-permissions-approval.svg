<g class="edge" id="e-to_allow"><polyline points="1160,130 1190,130" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1190,130 1179.2,135.2 1179.2,124.8" fill="#1e1e1e"/></g>
<g class="node" id="n-allow"><rect x="1190" y="90" width="200" height="80" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1290.0" y="136.3">4. allow rules</tspan></text></g>
<g class="edge" id="e-to_risk"><polyline points="1390,130 1420,130" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1420,130 1409.2,135.2 1409.2,124.8" fill="#1e1e1e"/></g>
<g class="node" id="n-risk"><rect x="1420" y="90" width="200" height="80" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1520.0" y="125.0">5. tool risk</tspan><tspan x="1520.0" y="147.6">policy</tspan></text></g>
<g class="node" id="n-_1"><rect x="270" y="200" width="200" height="50" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="370.0" y="230.6">deny</tspan></text></g>
<g class="node" id="n-_2"><rect x="270" y="260" width="200" height="50" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="370.0" y="290.6">modify arguments</tspan></text></g>
<g class="node" id="n-_3"><rect x="500" y="200" width="200" height="50" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="600.0" y="230.6">match -&gt; deny</tspan></text></g>
<g class="node" id="n-_4"><rect x="730" y="200" width="200" height="60" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="830.0" y="225.6">plan: non-read-only</tspan><tspan x="830.0" y="245.6">-&gt; deny</tspan></text></g>
<g class="node" id="n-_5"><rect x="730" y="275" width="200" height="60" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="830.0" y="300.6">bypass / accept_edits</tspan><tspan x="830.0" y="320.6">-&gt; allow</tspan></text></g>
<g class="node" id="n-_6"><rect x="960" y="200" width="200" height="50" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1060.0" y="230.6">match -&gt; ask</tspan></text></g>
<g class="node" id="n-_7"><rect x="1190" y="200" width="200" height="50" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1290.0" y="230.6">match -&gt; allow</tspan></text></g>
<g class="node" id="n-_8"><rect x="1420" y="200" width="200" height="60" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1520.0" y="225.6">high_risk / destructive</tspan><tspan x="1520.0" y="245.6">-&gt; ask</tspan></text></g>
<g class="node" id="n-_9"><rect x="1420" y="275" width="200" height="50" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1520.0" y="305.6">otherwise -&gt; allow</tspan></text></g>
<text x="40" y="383" font-size="18" fill="#555555" font-weight="normal"><tspan x="40" dy="0">The first decision wins, left to right. Guardrails inside the tools (workspace paths, command rules) always apply, even in bypass mode.</tspan></text>
<g class="node" id="n-refused"><rect x="40" y="430" width="420" height="100" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="250.0" y="475.1">Refused</tspan><tspan x="250.0" y="497.6">error result returned to the model</tspan></text></g>
<g class="node" id="n-requested"><rect x="560" y="430" width="480" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="800.0" y="475.1">APPROVAL_REQUESTED</tspan><tspan x="800.0" y="497.6">run pauses: AWAITING_INPUT</tspan></text></g>
