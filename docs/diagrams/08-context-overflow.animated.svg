<rect x="0" y="900" width="1500" height="110" fill="#1e1b2e"/>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0.0000;0.0823"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 1 of 12 · Build the view</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The usual bounded view: trimming and, if enabled, a summary.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0823;0.1646"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 2 of 12 · Apply a recorded cap</text><text x="40" y="980" font-size="19" fill="#d6d3e4">No cap yet on the first try; after an overflow, the smallest one.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1646;0.2469"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 3 of 12 · Call the model</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The request goes to the server as usual.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2469;0.3159"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 4 of 12 · Too long?</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The server rejects it: the harness&#x27;s 3.5-chars-per-token estimate was too low, or no window was set.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3159;0.3982"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 5 of 12 · How it is recognised</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Known server messages, plus your patterns; stated sizes (limit, requested) are parsed.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3982;0.4805"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 6 of 12 · Retries left?</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Up to [orchestrator] context_overflow_retries per step (default 2).</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4805;0.5628"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 7 of 12 · Pick a smaller cap</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The estimate times context_overflow_shrink, or the server&#x27;s stated ratio less 10%.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5628;0.6496"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 8 of 12 · Record it durably</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The cap is stored in the event, keyed by profile.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.6496;0.7319"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 9 of 12 · Retry with less context</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Older turns are omitted (with a notice) and large tool outputs shortened to fit the cap.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.7319;0.8354"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 10 of 12 · Call again</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The same step, now within the cap.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.8354;0.9044"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 11 of 12 · Accepted</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The run continues; later steps keep the cap.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="37.67s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.9044;1.0000"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 12 of 12 · Out of retries</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The run fails with the server&#x27;s message, as before Phase 13.</text></g>
</svg>