<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Helvetica, Arial, sans-serif">
<rect width="1500" height="900" fill="#ffffff"/>
<text x="40" y="50" font-size="30" fill="#1e1e1e" font-weight="bold"><tspan x="40" dy="0">Context overflow: when the server says the request is too long</tspan></text>
<g class="node" id="n-build"><rect x="40" y="100" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="170.0" y="140.1">Build view</tspan><tspan x="170.0" y="162.6">(trim / summary)</tspan></text></g>
<g class="edge" id="e-c1"><polyline points="300,145 360,145" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="360,145 349.2,150.2 349.2,139.8" fill="#1e1e1e"/></g>
<g class="node" id="n-cap"><rect x="360" y="100" width="280" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="500.0" y="130.6">Apply overflow cap</tspan><tspan x="500.0" y="150.6">(smallest recorded</tspan><tspan x="500.0" y="170.6">for this profile)</tspan></text></g>
<g class="edge" id="e-c2"><polyline points="640,145 700,145" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="700,145 689.2,150.2 689.2,139.8" fill="#1e1e1e"/></g>
<g class="node" id="n-send"><rect x="700" y="100" width="240" height="90" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="820.0" y="151.3">Model request</tspan></text></g>
<g class="edge" id="e-c3"><polyline points="940,145 1000,145" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1000,145 989.2,150.2 989.2,139.8" fill="#1e1e1e"/></g>
<g class="node" id="n-over"><polygon points="1130.0,75 1260,145.0 1130.0,215 1000,145.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1130.0" y="140.6">server: context</tspan><tspan x="1130.0" y="160.6">too long?</tspan></text></g>
<g class="edge" id="e-c_no"><polyline points="1260,145 1300,145" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1300,145 1289.2,150.2 1289.2,139.8" fill="#1e1e1e"/></g>
<g class="node" id="n-accept"><rect x="1300" y="100" width="180" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1390.0" y="140.1">Reply</tspan><tspan x="1390.0" y="162.6">accepted</tspan></text></g>
<g class="edge" id="e-c_yes"><polyline points="1130,215 1130,330" fill="none" stroke="#ef4444" stroke-width="2"/><polygon points="1130,330 1124.8,319.2 1135.2,319.2" fill="#ef4444"/></g>
<g class="node" id="n-left"><polygon points="1130.0,330 1260,400.0 1130.0,470 1000,400.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1130.0" y="385.6">retries left?</tspan><tspan x="1130.0" y="405.6">context_overflow_</tspan><tspan x="1130.0" y="425.6">retries</tspan></text></g>
<g class="edge" id="e-c_none"><polyline points="1130,470 1130,560" fill="none" stroke="#ef4444" stroke-width="2"/><polygon points="1130,560 1124.8,549.2 1135.2,549.2" fill="#ef4444"/></g>
<g class="node" id="n-fail"><rect x="1000" y="560" width="260" height="90" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1130.0" y="600.6">Run fails with the</tspan><tspan x="1130.0" y="620.6">provider&#x27;s message</tspan></text></g>
<g class="edge" id="e-c_more"><polyline points="1000,400 940,400" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="940,400 950.8,394.8 950.8,405.2" fill="#1e1e1e"/></g>
<g class="node" id="n-estimate"><rect x="640" y="350" width="300" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="790.0" y="385.6">Estimate the request;</tspan><tspan x="790.0" y="405.6">cap = estimate x shrink</tspan><tspan x="790.0" y="425.6">(or stated ratio - 10%)</tspan></text></g>
<g class="edge" id="e-c4"><polyline points="640,400 580,400" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="580,400 590.8,394.8 590.8,405.2" fill="#1e1e1e"/></g>
<g class="node" id="n-persist"><rect x="280" y="350" width="300" height="100" rx="12" fill="#c3fae8" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="430.0" y="385.6">MODEL_RESPONDED</tspan><tspan x="430.0" y="405.6">context_overflow: true</tspan><tspan x="430.0" y="425.6">max_input_tokens</tspan></text></g>
<g class="edge" id="e-c_retry"><polyline points="430,350 430,190" fill="none" stroke="#8b5cf6" stroke-width="2"/><polygon points="430,190 435.2,200.8 424.8,200.8" fill="#8b5cf6"/></g>
<g class="node" id="n-detect"><rect x="1290" y="330" width="200" height="320" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1390.0" y="416.1">Recognised:</tspan><tspan x="1390.0" y="433.6">vLLM / OpenAI</tspan><tspan x="1390.0" y="451.1">(maximum context</tspan><tspan x="1390.0" y="468.6">length), SGLang,</tspan><tspan x="1390.0" y="486.1">llama.cpp</tspan><tspan x="1390.0" y="503.6">(exceed_context_</tspan><tspan x="1390.0" y="521.1">size, n_ctx),</tspan><tspan x="1390.0" y="538.6">plus your</tspan><tspan x="1390.0" y="556.1">context_overflow_</tspan><tspan x="1390.0" y="573.6">patterns</tspan></text></g>
<g class="edge" id="e-c_detect"><polyline points="1290,360 1200,185" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/><polygon points="1200,185 1209.6,192.2 1200.3,197.0" fill="#f59e0b"/></g>
<text x="40" y="736" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">The cap is persisted, so resume rebuilds the same view. It stays for the rest of the run</tspan></text>
<text x="40" y="761" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">on that profile, and later turns stay append-only between trims.</tspan></text>
<text x="40" y="796" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">Retries count against max_model_attempts. Profiles without context_window are covered too.</tspan></text>
<text x="40" y="821" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">Each tool output is shortened to at most a quarter of the cap.</tspan></text>
<rect x="1265.04" y="132.0" width="29.92" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1280.0" y="150.6">no</tspan></text>
<rect x="1110.56" y="259.5" width="38.88" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1130.0" y="278.1">yes</tspan></text>
<rect x="1115.04" y="502.0" width="29.92" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1130.0" y="520.6">no</tspan></text>
<rect x="950.56" y="387.0" width="38.88" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="970.0" y="405.6">yes</tspan></text>
<rect x="361.28" y="257.0" width="137.44" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="430.0" y="275.6">retry the step</tspan></text>
</svg>