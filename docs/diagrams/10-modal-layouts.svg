<text x="533.0" y="1266.0" font-size="15" font-weight="normal" fill="#1e1e1e" text-anchor="start">• 429 when the shared pool is busy (retried)</text>
<text x="533.0" y="1292.0" font-size="15" font-weight="normal" fill="#1e1e1e" text-anchor="start">• guard KV cache about 3 GiB</text>
