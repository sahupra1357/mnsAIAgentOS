<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" width="1500" height="960" font-family="Helvetica, Arial, sans-serif">
<rect width="1500" height="960" fill="#ffffff"/>
<text x="40" y="50" font-size="30" fill="#1e1e1e" font-weight="bold"><tspan x="40" dy="0">Tool platform: sources, persistent catalog, dynamic loading</tspan></text>
<g class="node" id="n-py"><rect x="40" y="90" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="170.0" y="130.1">[[tools]] kind = python</tspan><tspan x="170.0" y="152.6">module:register</tspan></text></g>
<g class="node" id="n-http"><rect x="330" y="90" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="460.0" y="130.1">[[tools]] kind = http</tspan><tspan x="460.0" y="152.6">declarative JSON API</tspan></text></g>
<g class="node" id="n-web"><rect x="620" y="90" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="130.1">web_search (Tavily)</tspan><tspan x="750.0" y="152.6">key from env or file</tspan></text></g>
<g class="node" id="n-mcp"><rect x="910" y="90" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1040.0" y="130.1">[[mcp_servers]]</tspan><tspan x="1040.0" y="152.6">stdio / streamable HTTP</tspan></text></g>
<g class="node" id="n-server"><rect x="1200" y="90" width="260" height="90" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1330.0" y="130.1">MCP server</tspan><tspan x="1330.0" y="152.6">process or endpoint</tspan></text></g>
<g class="edge" id="e-rpc"><polyline points="1170,135 1200,135" fill="none" stroke="#4a9eed" stroke-width="2"/><polygon points="1200,135 1189.2,140.2 1189.2,129.8" fill="#4a9eed"/><polygon points="1170,135 1180.8,129.8 1180.8,140.2" fill="#4a9eed"/></g>
<g class="node" id="n-registry"><rect x="330" y="260" width="840" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="300.1">ToolRuntime registry: handlers re-attached at every start</tspan><tspan x="750.0" y="322.6">validation, timeouts, idempotency, approval by risk</tspan></text></g>
<g class="edge" id="e-a_py"><polyline points="170,180 430,260" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="430,260 418.1,261.8 421.2,251.8" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_http"><polyline points="460,180 560,260" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="560,260 548.3,257.3 554.8,249.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_web"><polyline points="750,180 750,260" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="750,260 744.8,249.2 755.2,249.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_mcp"><polyline points="1040,180 1000,260" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1000,260 1000.2,248.0 1009.5,252.7" fill="#1e1e1e"/></g>
<g class="node" id="n-catalog"><rect x="330" y="420" width="840" height="100" rx="12" fill="#c3fae8" stroke="#22c55e" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="465.1">tool_catalog table (SQLite / Postgres)</tspan><tspan x="750.0" y="487.6">source, spec hash, risk, trust, enabled (switch), available</tspan></text></g>
<g class="edge" id="e-a_sync"><polyline points="750,350 750,420" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="750,420 744.8,409.2 755.2,409.2" fill="#1e1e1e"/></g>
<g class="node" id="n-admin"><rect x="40" y="420" width="250" height="100" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="165.0" y="453.8">tools list / sync</tspan><tspan x="165.0" y="476.3">enable / disable</tspan><tspan x="165.0" y="498.8">(persists)</tspan></text></g>
<g class="edge" id="e-a_admin"><polyline points="290,470 330,470" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="330,470 319.2,475.2 319.2,464.8" fill="#1e1e1e"/></g>
<g class="node" id="n-mode"><polygon points="750.0,580 880,645.0 750.0,710 620,645.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="640.0">tool_loading</tspan><tspan x="750.0" y="662.5">mode?</tspan></text></g>
<g class="edge" id="e-a_offer"><polyline points="750,520 750,580" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="750,580 744.8,569.2 755.2,569.2" fill="#1e1e1e"/></g>
<g class="node" id="n-all"><rect x="250" y="760" width="330" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="415.0" y="805.0">mode = all</tspan><tspan x="415.0" y="827.5">every enabled tool is offered</tspan></text></g>
<g class="edge" id="e-a_all"><polyline points="620,645 415,645 415,760" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="415,760 409.8,749.2 420.2,749.2" fill="#1e1e1e"/></g>
<g class="node" id="n-dynamic"><rect x="920" y="760" width="470" height="120" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1155.0" y="805.6">mode = dynamic</tspan><tspan x="1155.0" y="825.6">core tools + search_tools + load_tools</tspan><tspan x="1155.0" y="845.6">+ loaded tools (appended, saved on the run)</tspan></text></g>
<g class="edge" id="e-a_dyn"><polyline points="880,645 1155,645 1155,760" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1155,760 1149.8,749.2 1160.2,749.2" fill="#1e1e1e"/></g>
<g class="node" id="n-untrusted"><rect x="1200" y="420" width="270" height="100" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1335.0" y="455.6">Untrusted output</tspan><tspan x="1335.0" y="475.6">(web, HTTP, MCP) wrapped</tspan><tspan x="1335.0" y="495.6">as data</tspan></text></g>
<text x="40" y="921" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">MCP tools are named server__tool, ask for approval unless read_only, and see only the env vars named in env. Egress allowlists apply to HTTP, web search, and MCP.</tspan></text>
<rect x="960.24" y="197.0" width="119.52000000000001" height="46" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1020.0" y="215.6">cached specs</tspan><tspan x="1020.0" y="235.6">until sync</tspan></text>
<rect x="726.08" y="372.0" width="47.84" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="390.6">sync</tspan></text>
<rect x="658.88" y="537.0" width="182.24" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="750.0" y="555.6">enabled + available</tspan></text>
<rect x="440.56" y="632.0" width="38.88" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="460.0" y="650.6">all</tspan></text>
<rect x="1037.64" y="632.0" width="74.72" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1075.0" y="650.6">dynamic</tspan></text>
</svg>