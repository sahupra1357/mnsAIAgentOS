<g class="edge" id="e-a4"><polyline points="1110,200 1110,250" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1110,250 1104.8,239.2 1115.2,239.2" fill="#1e1e1e"/></g>
<g class="node" id="n-loop"><rect x="560" y="250" width="360" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="740.0" y="290.1">Orchestrator picks</tspan><tspan x="740.0" y="312.6">ready steps (deps done)</tspan></text></g>
<g class="edge" id="e-a5"><polyline points="1000,290 920,290" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="920,290 930.8,284.8 930.8,295.2" fill="#1e1e1e"/></g>
<g class="node" id="n-agents"><rect x="40" y="420" width="440" height="120" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="260.0" y="465.6">Agent steps, ready together</tspan><tspan x="260.0" y="485.6">child runs started by the orchestrator</tspan><tspan x="260.0" y="505.6">IN PARALLEL (budget split)</tspan></text></g>
