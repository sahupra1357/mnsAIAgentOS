<g class="node" id="n-child2"><rect x="280" y="590" width="200" height="70" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="380.0" y="620.0">writer</tspan><tspan x="380.0" y="642.5">child run</tspan></text></g>
<g class="edge" id="e-a_c1"><polyline points="140,540 140,590" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="140,590 134.8,579.2 145.2,579.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_c2"><polyline points="380,540 380,590" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="380,590 374.8,579.2 385.2,579.2" fill="#1e1e1e"/></g>
<g class="node" id="n-results"><rect x="40" y="720" width="440" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="260.0" y="760.0">Results collected (plan outbox)</tspan><tspan x="260.0" y="782.5">no model turn needed</tspan></text></g>
<g class="edge" id="e-a_r1"><polyline points="140,660 140,720" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="140,720 134.8,709.2 145.2,709.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_r2"><polyline points="380,660 380,720" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="380,720 374.8,709.2 385.2,709.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_back"><polyline points="480,765 510,765 510,315 560,315" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="560,315 549.2,320.2 549.2,309.8" fill="#1e1e1e"/></g>
<g class="node" id="n-main"><rect x="560" y="420" width="420" height="120" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="770.0" y="465.6">Main-model step</tspan><tspan x="770.0" y="485.6">&quot;[Plan] Execute step ...&quot;</tspan><tspan x="770.0" y="505.6">update_plan or a final answer</tspan></text></g>
<g class="edge" id="e-a_main"><polyline points="760,340 760,420" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="760,420 754.8,409.2 765.2,409.2" fill="#1e1e1e"/></g>
<g class="node" id="n-failed"><rect x="1040" y="420" width="420" height="120" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1250.0" y="465.6">Step failed</tspan><tspan x="1250.0" y="485.6">&quot;[Plan] ... failed&quot; -&gt; revise_plan</tspan><tspan x="1250.0" y="505.6">(at most max_replans)</tspan></text></g>
<g class="edge" id="e-a_fail"><polyline points="980,480 1040,480" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1040,480 1029.2,485.2 1029.2,474.8" fill="#1e1e1e"/></g>
<g class="node" id="n-revise"><rect x="1040" y="720" width="420" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1250.0" y="760.0">revise_plan</tspan><tspan x="1250.0" y="782.5">completed steps are kept</tspan></text></g>
<g class="edge" id="e-a_rev"><polyline points="1250,540 1250,720" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1250,720 1244.8,709.2 1255.2,709.2" fill="#1e1e1e"/></g>
<g class="edge" id="e-a_rev_back"><polyline points="1040,765 1010,765 1010,330 920,330" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="920,330 930.8,324.8 930.8,335.2" fill="#1e1e1e"/></g>
<g class="node" id="n-final"><rect x="560" y="720" width="420" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="770.0" y="760.0">All steps finished</tspan><tspan x="770.0" y="782.5">-&gt; final answer -&gt; completed</tspan></text></g>
<g class="edge" id="e-a_final"><polyline points="760,540 760,720" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="760,720 754.8,709.2 765.2,709.2" fill="#1e1e1e"/></g>
<text x="40" y="876" font-size="16" fill="#555555" font-weight="normal"><tspan x="40" dy="0">Plans are stored on the run with plan_* events. Approvals inside a child pause the parent; a crash resumes at the same step.</tspan></text>
