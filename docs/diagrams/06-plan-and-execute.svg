<g class="edge" id="e-a1"><polyline points="290,135 340,135" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="340,135 329.2,140.2 329.2,129.8" fill="#1e1e1e"/></g>
<g class="node" id="n-explore"><rect x="340" y="90" width="260" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="470.0" y="130.1">Explore</tspan><tspan x="470.0" y="152.6">(read-only tools only)</tspan></text></g>
<g class="edge" id="e-a2"><polyline points="600,135 650,135" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="650,135 639.2,140.2 639.2,129.8" fill="#1e1e1e"/></g>
