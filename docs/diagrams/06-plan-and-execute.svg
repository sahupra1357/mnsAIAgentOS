<g class="edge" id="e-a3"><polyline points="910,135 960,135" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="960,135 949.2,140.2 949.2,129.8" fill="#1e1e1e"/></g>
<g class="node" id="n-valid"><polygon points="1110.0,70 1260,135.0 1110.0,200 960,135.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1110.0" y="130.6">valid? ids, deps,</tspan><tspan x="1110.0" y="150.6">no cycles, agents</tspan></text></g>
<g class="edge" id="e-invalid"><polyline points="1260,135 1320,135 1320,60 780,60 780,90" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6"/><polygon points="780,90 774.8,79.2 785.2,79.2" fill="#ef4444"/></g>
