<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1010" width="1460" height="1010" font-family="Helvetica, Arial, sans-serif">
<rect width="1460" height="1010" fill="#ffffff"/>
<text x="40" y="50" font-size="30" fill="#1e1e1e" font-weight="bold"><tspan x="40" dy="0">Subagents: the agent tool spawns a child run</tspan></text>
<rect x="20" y="70" width="1420" height="330" rx="16" fill="#e5dbff" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
<text x="35" y="102" font-size="22" fill="#6d28d9" font-weight="bold"><tspan x="35" dy="0">Parent run</tspan></text>
<g class="node" id="n-call"><rect x="40" y="150" width="240" height="100" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="160.0" y="183.8">Model calls the</tspan><tspan x="160.0" y="206.3">agent tool</tspan><tspan x="160.0" y="228.8">(name, task)</tspan></text></g>
<g class="edge" id="e-a1"><polyline points="280,200 320,200" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="320,200 309.2,205.2 309.2,194.8" fill="#1e1e1e"/></g>
<g class="node" id="n-limits"><rect x="320" y="150" width="240" height="100" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="440.0" y="185.6">Check limits</tspan><tspan x="440.0" y="205.6">depth &lt; max_depth</tspan><tspan x="440.0" y="225.6">spawned &lt; max_per_run</tspan></text></g>
<g class="node" id="n-refused"><rect x="320" y="280" width="240" height="60" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="440.0" y="305.6">otherwise: refused,</tspan><tspan x="440.0" y="325.6">error result to model</tspan></text></g>
<g class="edge" id="e-a2"><polyline points="560,200 600,200" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="600,200 589.2,205.2 589.2,194.8" fill="#1e1e1e"/></g>
<g class="node" id="n-started"><rect x="600" y="150" width="240" height="100" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="720.0" y="185.6">SUBAGENT_STARTED</tspan><tspan x="720.0" y="205.6">child id = hash of</tspan><tspan x="720.0" y="225.6">parent, step, call</tspan></text></g>
<g class="edge" id="e-a3"><polyline points="840,200 880,200" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="880,200 869.2,205.2 869.2,194.8" fill="#1e1e1e"/></g>
<g class="node" id="n-waiting"><rect x="880" y="150" width="240" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1000.0" y="195.1">Parent pauses</tspan><tspan x="1000.0" y="217.6">SUBAGENT_WAITING</tspan></text></g>
<g class="node" id="n-finished"><rect x="1160" y="150" width="260" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1290.0" y="185.6">SUBAGENT_FINISHED</tspan><tspan x="1290.0" y="205.6">final answer -&gt; tool result</tspan><tspan x="1290.0" y="225.6">usage rolls up</tspan></text></g>
<rect x="20" y="430" width="1420" height="340" rx="16" fill="#dbe4ff" fill-opacity="0.3" stroke="#4a9eed" stroke-width="1"/>
<text x="35" y="462" font-size="22" fill="#2563eb" font-weight="bold"><tspan x="35" dy="0">Child run (same orchestrator, same store)</tspan></text>
<g class="edge" id="e-create"><polyline points="720,250 720,500" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="720,500 714.8,489.2 725.2,489.2" fill="#1e1e1e"/></g>
<g class="node" id="n-child"><rect x="600" y="500" width="240" height="120" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="720.0" y="535.6">Child run</tspan><tspan x="720.0" y="555.6">own prompt, tool subset,</tspan><tspan x="720.0" y="575.6">profile, budget</tspan><tspan x="720.0" y="595.6">&lt;= what parent has left</tspan></text></g>
<g class="edge" id="e-a4"><polyline points="840,560 880,560" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="880,560 869.2,565.2 869.2,554.8" fill="#1e1e1e"/></g>
<g class="node" id="n-loop"><rect x="880" y="510" width="240" height="100" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1000.0" y="555.0">Child loop</tspan><tspan x="1000.0" y="577.5">model + tools</tspan></text></g>
<g class="edge" id="e-a5"><polyline points="1120,560 1160,560" fill="none" stroke="#1e1e1e" stroke-width="2"/><polygon points="1160,560 1149.2,565.2 1149.2,554.8" fill="#1e1e1e"/></g>
<g class="node" id="n-ends"><rect x="1160" y="510" width="260" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text font-size="18" text-anchor="middle" fill="#1e1e1e"><tspan x="1290.0" y="555.0">Child ends</tspan><tspan x="1290.0" y="577.5">completed / failed</tspan></text></g>
<g class="edge" id="e-result"><polyline points="1290,510 1290,250" fill="none" stroke="#22c55e" stroke-width="2"/><polygon points="1290,250 1295.2,260.8 1284.8,260.8" fill="#22c55e"/></g>
<g class="edge" id="e-needs"><polyline points="1000,610 1000,650" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/><polygon points="1000,650 994.8,639.2 1005.2,639.2" fill="#f59e0b"/></g>
<g class="node" id="n-approval"><rect x="880" y="650" width="260" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1010.0" y="685.6">Child needs approval</tspan><tspan x="1010.0" y="705.6">-&gt; parent AWAITING_INPUT</tspan><tspan x="1010.0" y="725.6">approve PARENT_ID</tspan></text></g>
<g class="node" id="n-notes"><rect x="40" y="800" width="1400" height="70" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="740.0" y="840.6">Cancel the parent -&gt; its children are cancelled.   Resume the parent -&gt; the unfinished child resumes.   Children inherit the parent&#x27;s permission mode.</tspan></text></g>
<rect x="687.12" y="362.0" width="65.76" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="720.0" y="380.6">create</tspan></text>
<rect x="1257.12" y="367.0" width="65.76" height="26" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text font-size="16" text-anchor="middle" fill="#1e1e1e"><tspan x="1290.0" y="385.6">result</tspan></text>
<g opacity="0"><rect x="34" y="144" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0.0000;0.0648"/></g>
<g opacity="0"><rect x="314" y="144" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0936;0.1584"/></g>
<g opacity="0"><rect x="594" y="144" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1871;0.2519"/></g>
<g opacity="0"><rect x="874" y="144" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2807;0.3455"/></g>
<g opacity="0"><rect x="594" y="494" width="252" height="132" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3982;0.4630"/></g>
<g opacity="0"><rect x="874" y="504" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4922;0.5570"/></g>
<g opacity="0"><rect x="874" y="644" width="272" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5719;0.6367"/></g>
<g opacity="0"><rect x="874" y="504" width="252" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.6517;0.7165"/></g>
<g opacity="0"><rect x="1154" y="504" width="272" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.7462;0.8110"/></g>
<g opacity="0"><rect x="1154" y="144" width="272" height="112" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.8455;0.9103"/></g>
<g opacity="0"><rect x="34" y="794" width="1412" height="82" rx="12" fill="none" stroke="#e11d48" stroke-width="6"/><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.9103;0.9751"/></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0.0000;0.9103"/><g><circle r="20" fill="#e11d48" fill-opacity="0.22"/><circle r="10" fill="#e11d48" stroke="#ffffff" stroke-width="3"/><animateMotion dur="40.12s" repeatCount="indefinite" calcMode="linear" path="M160.0,150.0 L280.0,200.0 L320.0,200.0 L440.0,150.0 L560.0,200.0 L600.0,200.0 L720.0,150.0 L840.0,200.0 L880.0,200.0 L1000.0,150.0 L880.0,200.0 L840.0,200.0 L720.0,250.0 L720.0,500.0 L720.0,500.0 L840.0,560.0 L880.0,560.0 L1000.0,510.0 L1000.0,610.0 L1000.0,650.0 L1010.0,650.0 L1000.0,650.0 L1000.0,610.0 L1000.0,510.0 L1120.0,560.0 L1160.0,560.0 L1290.0,510.0 L1290.0,510.0 L1290.0,250.0 L1290.0,150.0" keyTimes="0.0000;0.0648;0.0936;0.1584;0.1871;0.2519;0.2807;0.3455;0.3982;0.4630;0.4922;0.5570;0.5719;0.6367;0.6517;0.7165;0.7462;0.8110;0.8455;0.9103;1.0000" keyPoints="0.0000;0.0000;0.1102;0.1102;0.2203;0.2203;0.3305;0.3305;0.5324;0.5324;0.6441;0.6441;0.6992;0.6992;0.7543;0.7543;0.8678;0.8678;1.0000;1.0000;1.0000"/></g></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.9103;0.9751"/><g><circle r="20" fill="#e11d48" fill-opacity="0.22"/><circle r="10" fill="#e11d48" stroke="#ffffff" stroke-width="3"/><animateMotion dur="40.12s" repeatCount="indefinite" calcMode="linear" path="M740.0,800.0 L740.0,800.0" keyTimes="0.0000;0.9103;0.9751;1.0000" keyPoints="0.0000;0.0000;0.0000;0.0000"/></g></g>
<rect x="0" y="900" width="1460" height="110" fill="#1e1b2e"/>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0.0000;0.0648"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 1 of 11 · The parent delegates</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The parent&#x27;s model calls the agent tool with a subagent name and task.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.0648;0.1584"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 2 of 11 · Check limits</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Depth must stay under max_depth and the run under max_per_run subagents.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1584;0.2519"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 3 of 11 · Child id is derived</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The id is a hash of parent, step, and call, so a resumed parent finds the same child.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2519;0.3455"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 4 of 11 · Parent pauses</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The parent&#x27;s agent call stays pending while the child works.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3455;0.4630"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 5 of 11 · Child run is created</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Its own system prompt, tool subset, and profile; its budget is capped by what the parent has left.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.4630;0.5570"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 6 of 11 · Child works</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The child runs the normal loop on the same orchestrator and store.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.5570;0.6367"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 7 of 11 · Child needs approval</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The parent also shows AWAITING_INPUT; approve PARENT_ID decides the child&#x27;s call.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.6367;0.7165"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 8 of 11 · Child continues</text><text x="40" y="980" font-size="19" fill="#d6d3e4">After the decision the child resumes its loop.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.7165;0.8110"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 9 of 11 · Child ends</text><text x="40" y="980" font-size="19" fill="#d6d3e4">The child completes (or fails) with a final answer.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.8110;0.9103"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 10 of 11 · Result returns</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Only the final answer returns as the tool result; the child&#x27;s tokens and cost roll up.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="40.12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.9103;0.9751"/><text x="40" y="942" font-size="24" font-weight="bold" fill="#ffffff">Step 11 of 11 · Lifecycle rules</text><text x="40" y="980" font-size="19" fill="#d6d3e4">Cancelling a parent cancels its children, and resuming a parent resumes its unfinished child.</text></g>
</svg>