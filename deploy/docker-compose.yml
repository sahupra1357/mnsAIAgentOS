# Postgres, the HTTP API, and two queue workers.
#   cp deploy/.env.example deploy/.env   # then set real values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
# The built-in web chat is at http://localhost:8000/ui (enter an API key in its settings).
# Optional Open WebUI on http://localhost:3000, talking to the harness's /v1 endpoint:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile chat up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_DB: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      retries: 10

  api:
    build: ..
    command: ["serve", "--config", "/config/models.toml", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "0"]
    environment: &harness-env
      AGENT_HARNESS_DATABASE_URL: postgresql://harness:${POSTGRES_PASSWORD}@postgres:5432/harness
      AGENT_HARNESS_ADMIN_KEY: ${AGENT_HARNESS_ADMIN_KEY:?set AGENT_HARNESS_ADMIN_KEY}
      AGENT_HARNESS_TEAM_A_KEY: ${AGENT_HARNESS_TEAM_A_KEY:?set AGENT_HARNESS_TEAM_A_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AGENT_HARNESS_USER_SETTINGS: /nonexistent
      AGENT_HARNESS_ENTERPRISE_SETTINGS: /nonexistent
    volumes:
      - ./models.toml:/config/models.toml:ro
      - harness-data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/readyz').status != 200)"]
      interval: 10s
      retries: 5

  worker:
    build: ..
    command: ["worker", "--config", "/config/models.toml", "--workers", "2"]
    environment: *harness-env
    volumes:
      - ./models.toml:/config/models.toml:ro
      - harness-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  open-webui:
    # Any OpenAI-compatible chat UI works; this one is optional (`--profile chat`).
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["chat"]
    environment:
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: ${AGENT_HARNESS_TEAM_A_KEY:?set AGENT_HARNESS_TEAM_A_KEY}
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  harness-data:
  open-webui:
