[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "A durable, provider-neutral workflow harness for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Agent Harness contributors"}]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
api = ["uvicorn>=0.30"]
# Pin to an exact version you have tested before production use.
litellm = ["litellm>=1.50,<2"]

[project.scripts]
agent-harness = "agent_harness.cli:main"
agent-harness-bench = "agent_harness.bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

