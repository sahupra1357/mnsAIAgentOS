# --- Features ----------------------------------------------------------------------
# `--feature NAME` runs only that feature's checks; without it every check runs.

[[feature]]
name = "core"
description = "Agent loop, durable state, retries, budgets, runaway guards, tool runtime"
tests = ["test_orchestrator", "test_config", "test_dotenv_profile_switch", "test_durability", "test_reliability", "test_runaway_guards",
         "test_persistence", "test_store_conformance", "test_tools"]
scenarios = ["calculator", "transient_model_failure", "unknown_tool_recovery",
             "repeated_call_refusal", "tool_calls_per_reply"]
benchmarks = ["gsm8k"]

[[feature]]
name = "providers"
description = "Model gateway and adapters: llama.cpp, Ollama, Modal, LiteLLM, reasoning, gateway options"
tests = ["test_model_gateway", "test_providers", "test_gateway_ops", "test_litellm", "test_reasoning", "test_tool_name_recovery",
         "test_self_contained_profiles"]
smoke = ["default"]
benchmarks = ["bfcl"]

[[feature]]
name = "context"
description = "Context window: trimming, summarization, server token counts, overflow recovery, limits"
tests = ["test_context", "test_summarization", "test_phase13_limits", "test_phase14"]
scenarios = ["context_overflow_recovery"]
benchmarks = ["context"]

[[feature]]
name = "guardrails"
description = "Input, output, and tool-output guards; taint mode; red-team set"
tests = ["test_guardrails"]
scenarios = ["guardrail_refusal", "output_secret_redacted"]
benchmarks = ["guardrails"]

[[feature]]
name = "hooks-permissions"
description = "Command hooks, permission rules and modes, plan mode"
tests = ["test_hooks_permissions"]
scenarios = ["full_config_read_with_hooks", "hook_denies_command", "permission_deny_rule",
             "permission_ask_rule", "plan_mode_then_edit"]

[[feature]]
name = "interaction"
description = "Conversations, steering, ask_user, deadlines, structured output, CLI defaults and chat"
tests = ["test_conversation", "test_ask_user", "test_structured_output", "test_cli_defaults"]
scenarios = ["ask_user", "question_deadline", "structured_output", "ask_user_full_config"]

[[feature]]
name = "subagents-planning"
description = "Subagents, task lists, plans, plan-and-execute, parallel delegation"
tests = ["test_subagents_tasks", "test_planning_delegation", "test_example_subagents", "test_agents_suite"]
scenarios = ["subagent_delegation", "task_tracking"]
benchmarks = ["agents"]

[[feature]]
name = "extensibility"
description = "Instruction files, skills, templates, layered settings, plugins, rewind, full config"
tests = ["test_instructions_settings_plugins", "test_instruction_discovery", "test_rewind",
         "test_full_config"]
scenarios = ["skill_loading", "plan_mode_then_edit"]

[[feature]]
name = "tools"
description = "Tool catalog, python/http sources, MCP, web_fetch, web_search, dynamic tool loading"
tests = ["test_tool_platform", "test_phase14"]
scenarios = ["dynamic_tool_loading"]

[[feature]]
name = "memory"
description = "Artifacts, long-term memory (keyword, semantic, hybrid), memory backends"
tests = ["test_artifacts_memory_evals", "test_memory_backends", "test_phase14",
         "test_self_contained_profiles"]
scenarios = ["memory_roundtrip"]
benchmarks = ["memory"]

[[feature]]
name = "coding"
description = "Workspace-safe coding tools, Docker sandbox, warm per-run containers, rewind"
tests = ["test_coding", "test_sandbox_containers", "test_rewind", "test_sandbox_failures"]
scenarios = ["plan_mode_then_edit"]
benchmarks = ["humaneval"]

[[feature]]
name = "api-workers"
description = "HTTP API, chat API, OpenAI-compatible endpoint, web UI, workers, run listing, telemetry"
tests = ["test_api_workers", "test_chat_api", "test_openai_chat", "test_web_ui", "test_worker_reliability",
         "test_run_listing", "test_observability"]

[[feature]]
name = "production"
description = "Migrations, Postgres, tenancy, quotas, secrets, egress, redaction, retention"
tests = ["test_production_hardening", "test_quota_enforcement", "test_store_conformance"]

[[feature]]
name = "validation"
description = "Benchmarks, pipeline, residency, live-check suites, feature coverage"
tests = ["test_bench", "test_pipeline_observability", "test_residency", "test_live_check_suites",
         "test_feature_validation", "test_validation_progress"]
