# Validation pipeline plan: agent-harness-bench pipeline examples/validation.toml
# Paths are relative to this file. Replace the sample datasets with the public
# datasets you download (see docs/VALIDATION.md) and raise `limit`.
#
# Master run (every feature):   scripts/validate.sh
# One or more features:         scripts/validate.sh guardrails memory
# Without model servers:        scripts/validate.sh --offline
# List the features:            scripts/validate.sh --list
# The [[feature]] entries at the end map each feature to its unit-test modules,
# scenarios, smoke profiles, and benchmarks (tests/test_feature_validation.py checks
# that every test module and scenario belongs to a feature).

[pipeline]
config = "../models.toml"         # the repository's full-feature config (llama.cpp default)
repo = ".."                       # repository root (static/unit stages)
output_dir = "../validation-results"
# Stage order: static, unit, scenarios, smoke, benchmarks, gates

[scenarios]
path = "evals"                    # offline scripted scenarios
# Bare scenarios (no `config` key) use this config's tools (the calculator lives here);
# application-backed scenarios name ../../models.toml themselves.
config = "models.toml"

# Ollama and llama.cpp on one machine share GPU memory. With this on, large models on
# the other local server are unloaded before each local profile runs, and restored
# before remote profiles and at the end (see docs/VALIDATION.md).
# On: llama.cpp (Qwen3.8-27B) and Ollama (gpt-oss:20b) on this machine cannot both hold
# a large model in GPU memory. Before each local profile's smoke/benchmarks, large models
# loaded on the *other* server are unloaded through its API (Ollama keep_alive=0, the
# llama.cpp router's unload); everything is restored at the end. It reads only the
# servers named by the profiles in models.toml, so switching the default profile needs
# no change here. Remote profiles (Modal) are unaffected.
[residency]
enabled = true
min_params_b = 20

# --- Live checks: they follow the config's default profile ------------------------
# Gates: max_accuracy_drop allows about 1-2 items of model variation for each benchmark's
# size (one item is 100/n points), so a single different answer does not fail the run
# while a real regression still does. Raise `limit` for tighter gates.
# Entries without `profile` run on default_model_profile (llama.cpp in ../models.toml),
# and "{profile}" in a baseline path becomes that profile, so baselines stay per provider.
# Validate another provider end to end without editing this file:
#   AGENT_HARNESS_MODEL_PROFILE=ollama scripts/validate.sh     (or set it in .env)
# That profile serves everything itself: chat, embeddings (embedding_model), and the
# guard model (guard_model), so no check here depends on a second provider.

[[smoke]]                         # live: `agent-harness doctor` on the default profile
skip_cache = false                # (chat, tool calls, prefix cache, embeddings, guard model)
max_tokens = 512                  # thinking models (Qwen3) need room before answering

# Real datasets (scripts/fetch_datasets.sh downloads them once into datasets/, gitignored).
# Sizes are a balance: big enough that one miss moves accuracy a few points, not 33.
# `concurrency = 3` sends three items at once: llama.cpp (parallel slots), vLLM, and SGLang
# batch concurrent requests on the GPU, so results are unchanged and throughput rises
# (measured: bfcl on llama.cpp, 27B on a Mac, 8:46 -> 6:00 at the same 0.950; more on vLLM).
# Ollama only gains with OLLAMA_NUM_PARALLEL >= 3. Raise `limit` for release decisions.
# The bench/*_sample files stay for the offline harness self-check.
[[benchmark]]
name = "gsm8k"
suite = "gsm8k"
data = "../datasets/gsm8k/test.jsonl"
limit = 30
concurrency = 3
max_steps = 8
baseline = "../baselines/gsm8k-{profile}.json"
[benchmark.thresholds]
max_accuracy_drop = 0.07  # 2 of 30 items: one wobble is not a regression, three is
max_error_rate = 0.10

[[benchmark]]
name = "bfcl"
suite = "bfcl"
data = "../datasets/bfcl/mix.jsonl"             # 20 simple, 10 parallel, 10 irrelevance (BFCL v4)
answers = "../datasets/bfcl/mix_answers.jsonl"
concurrency = 3
baseline = "../baselines/bfcl-{profile}.json"
[benchmark.thresholds]
max_accuracy_drop = 0.05  # 2 of 40 items

# Guardrails red-team set (heuristics only, no model call; add `options = { model_guard = true }`
# and set guard_model on the default profile to include the Llama Guard classifier).
[[benchmark]]
name = "guardrails"
suite = "guardrails"
data = "bench/guardrails_sample.jsonl"
baseline = "../baselines/guardrails.json"
[benchmark.thresholds]
max_accuracy_drop = 0.0           # heuristics only: deterministic, so any drop is real
min_accuracy = 0.9                # floor that applies even before a baseline exists

# Coding path: generated code runs in Docker without network (needs a Docker daemon).
[[benchmark]]
name = "humaneval"
suite = "humaneval"
data = "../datasets/humaneval/HumanEval.jsonl.gz"
limit = 20
concurrency = 3
max_steps = 6
baseline = "../baselines/humaneval-{profile}.json"
[benchmark.thresholds]
max_accuracy_drop = 0.10  # 2 of 20 items
max_error_rate = 0.34             # sandbox (Docker) failures count as errors, not wrong answers
min_accuracy = 0.5                # floor that applies even before a baseline exists

# Context handling past the window: filler (JSON, code, prose) overflows the profile's
# context_window (16384 in models.toml), exercising trimming, server token counting
# (context_capped), and overflow recovery. Raise `turns` if all three counts stay 0.
[[benchmark]]
name = "context"
suite = "context"
data = "bench/context_sample.jsonl"
limit = 3
concurrency = 1
max_steps = 3
baseline = "../baselines/context-{profile}.json"
[benchmark.options]
turns = 48
chars_per_turn = 1500
[benchmark.thresholds]
max_accuracy_drop = 0.34  # 1 of 3 items
min_accuracy = 0.66
max_error_rate = 0.34

# Long-term memory: notes are saved, embedded with the profile's own embedding_model,
# and found by memory_search with different wording.
[[benchmark]]
name = "memory"
suite = "memory"
data = "bench/memory_sample.jsonl"
limit = 3
concurrency = 1
max_steps = 6
baseline = "../baselines/memory-{profile}.json"
[benchmark.options]
search = "hybrid"
[benchmark.thresholds]
max_accuracy_drop = 0.34  # 1 of 3 items
min_accuracy = 0.66
max_error_rate = 0.34

# Subagents: the top-level agent may only delegate (the `agent` tool) to a researcher subagent
# that reads notes; questions have independent parts, ideally delegated in parallel. Correct
# = every expected fact in the final answer; how it delegated is reported, not scored
# (details: subagents, max_parallel, facts_found). Synthetic data (no download).
[[benchmark]]
name = "agents"
suite = "agents"
data = "bench/agents_sample.jsonl"
max_steps = 8
baseline = "../baselines/agents-{profile}.json"
[benchmark.thresholds]
max_accuracy_drop = 0.17  # 1 of 6 items
min_accuracy = 0.66
max_error_rate = 0.34

