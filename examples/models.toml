# Select this profile by default. Override it with AGENT_HARNESS_MODEL_PROFILE
# (in .env or the shell) or --model-profile.
default_model_profile = "llamacpp"

# Turn a profile off with `enabled = false` in its table (or
# AGENT_HARNESS_MODEL__NAME__ENABLED=false). A disabled profile cannot be selected,
# routes to it are dropped, and it is removed from other profiles' fallback chains.
# `agent-harness profiles` lists it as disabled.

# Capability routes: use a route name anywhere a profile name is accepted.
[routes]
fast = "llamacpp"
strong = "modal"

# Any server exposing an OpenAI-compatible /chat/completions endpoint can be
# used: a hosted provider, vLLM, llama.cpp server, Ollama's compatible API, etc.
[models.local]
enabled = true
adapter = "openai_compatible"
model = "your-model-name"
endpoint = "http://127.0.0.1:8000/v1"
timeout_seconds = 60
max_retries = 2
retry_backoff_seconds = 0.25

[models.local.parameters]
temperature = 0.2
# Output cap: a runaway reply stops with finish_reason=length instead of
# generating until the context fills or the request times out.
max_tokens = 1024

[models.hosted]
enabled = true
adapter = "openai_compatible"
model = "your-hosted-model"
endpoint = "https://provider.example/v1"
api_key_env = "HOSTED_MODEL_API_KEY"
timeout_seconds = 60
max_retries = 2
retry_backoff_seconds = 0.25

[models.hosted.parameters]
temperature = 0.2
max_tokens = 1024

# --- Ollama -----------------------------------------------------------------
# `ollama serve`, then `ollama pull qwen2.5-coder:7b`. The OpenAI-compatible
# endpoint cannot set the context length; either start the server with
# OLLAMA_CONTEXT_LENGTH=8192 or set api_mode = "native" so context_window is
# sent as options.num_ctx.
[models.ollama]
enabled = true
adapter = "ollama"
model = "qwen2.5-coder:7b"
endpoint = "http://127.0.0.1:11434/v1"
api_mode = "openai"
context_window = 8192
timeout_seconds = 180
max_retries = 1

# Phase 16: the same Ollama server embeds (ollama pull nomic-embed-text); this adds the
# hidden companion profile `ollama.embed`. guard_model = "llama-guard3:1b" works the same way.
embedding_model = "nomic-embed-text"

[models.ollama.parameters]
temperature = 0.2
max_tokens = 1024

# --- llama.cpp ----------------------------------------------------------------
# Configured for a llama.cpp router (`llama serve --models-preset ... --port 9931 --jinja`),
# which loads models on demand and can serve several, so `model` must name the exact
# model to route to. --jinja is required for tool calls.
# Plain single-model server instead:
#   llama-server -m model.gguf --jinja -c 16384 --port 8080
#   endpoint = "http://127.0.0.1:8080/v1", any `model` label, context_window = 16384
[models.llamacpp]
enabled = true
adapter = "llama_cpp"
model = "ggml-org/Qwen3.8-27B-GGUF:Q4_K_M"
endpoint = "http://127.0.0.1:9931/v1"
# Keep equal to the server's context size for this model (ctx-size in the router's
# models preset). A tool-using run outgrows 4096 quickly; raise both together.
context_window = 4096
# Count large requests with the server's tokenizer (/apply-template + /tokenize) before
# sending, so a 4096 window is not overrun by the 3.5-chars-per-token estimate.
token_counting = "server"
# The router unloads idle models (--sleep-idle-seconds); reloading a 27B model is slow.
timeout_seconds = 600
max_retries = 1
# Thinking models (Qwen3, DeepSeek-R1): start llama-server with
# --reasoning-format deepseek so reasoning comes back separately. Without a parser,
# reasoning_tags = true splits <think>...</think> out of the answer instead.
# reasoning_tags = true
# reasoning_history = "drop"   # "keep" sends earlier reasoning back (costs context)

# The router serves an embedding model next to the chat model (preset section with
# `embedding = true`, router started with models-max >= 2): companion `llamacpp.embed`.
embedding_model = "nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0"

[models.llamacpp.parameters]
temperature = 0.2
max_tokens = 1024

# --- Modal (vLLM or SGLang) ----------------------------------------------------
# Deploy with examples/modal/vllm_server.py or examples/modal/sglang_server.py.
# Both auth layers are required: the server's bearer key and Modal proxy auth.
# The first request after scale-to-zero uses cold_start_timeout_seconds.
[models.modal]
enabled = true
adapter = "modal"
server = "vllm"            # or "sglang"
model = "Qwen/Qwen2.5-7B-Instruct"
endpoint = "https://WORKSPACE--agent-harness-vllm-serve.modal.run/v1"
api_key_env = "MODAL_LLM_API_KEY"
timeout_seconds = 120
cold_start_timeout_seconds = 600
max_retries = 1
context_window = 32768
token_counting = "server"   # vLLM /tokenize (not available with server = "sglang")

[models.modal.headers_env]
Modal-Key = "MODAL_PROXY_TOKEN_ID"
Modal-Secret = "MODAL_PROXY_TOKEN_SECRET"

# If Modal keeps failing after retries, continue the run on a local server.
# fallback = ["llamacpp", "ollama"]

[models.modal.parameters]
temperature = 0.2
max_tokens = 1024

# Estimated cost per request, so --max-cost-usd works. Use your GPU's actual rate.
# [models.modal.pricing]
# gpu_usd_per_second = 0.0003

# A separate embedding profile (older style; prefer embedding_model on the provider's own
# profile, which needs no cross-profile reference):
#   ollama pull nomic-embed-text
[models.embed]
enabled = true
adapter = "ollama"
model = "nomic-embed-text"
endpoint = "http://127.0.0.1:11434/v1"
timeout_seconds = 60

[models.embed.parameters]
max_tokens = 1024   # unused by /embeddings; keeps every example profile capped

# --- LiteLLM (optional; pip install -e '.[litellm]') ------------------------------
# Only profiles with adapter = "litellm" use LiteLLM; everything else stays direct.
# [models.claude]
# adapter = "litellm"
# model = "anthropic/claude-sonnet-5"
# api_key_env = "ANTHROPIC_API_KEY"

# --- Subagents ---------------------------------------------------------------------
# Define [[agents]] to give the model an `agent` tool that delegates a task to a child
# run. Nothing is offered while no agents are defined. A complete working example with
# a researcher, reviewer, and test runner is in examples/subagents.toml.
# [[agents]]
# name = "helper"
# description = "Solves one self-contained arithmetic question."
# prompt = "You are a careful assistant. Use the calculator, then answer briefly."
# tools = ["calculator"]      # tool subset; omit for every registered tool
# max_steps = 5
#
# [subagents]
# max_depth = 1               # default 2: subagents may start their own subagents
# max_per_run = 8

# Enable repository coding tools by setting enabled = true. The default Docker
# backend has no network and pauses before writes, commands, commits, or PRs.
# --- Guardrails (docs/GUARDRAILS.md) ----------------------------------------------
# Input/output/tool-output checks against prompt injection, jailbreaks, system-prompt
# leaks, secrets, and PII. Blocked input gets refusal_message; the chat continues.
# [guardrails]
# enabled = true
# refusal_message = "I can't help with that request."
# [guardrails.input]
# pii = "redact"                # default "allow"
# [guardrails.model]            # optional safety classifier (ollama pull llama-guard3:1b)
# profile = "guard"
# check = ["input", "output"]
#
# [models.guard]
# adapter = "ollama"
# model = "llama-guard3:1b"
# endpoint = "http://127.0.0.1:11434/v1"
# timeout_seconds = 30
# max_retries = 0

# Let runs ask the user clarifying questions (pauses the run; answer with
# `agent-harness answer RUN_ID "..."` or POST /runs/{id}/answer). Off by default.
# [interaction]
# ask_user = true
# approval_timeout_seconds = 3600   # resolve approvals left waiting this long (0 = wait forever)
# question_timeout_seconds = 3600
# on_timeout = "deny"               # deny | cancel | fail

# How views are estimated and trimmed. For code, JSON, or non-English work, a lower
# chars_per_token (about 2.5) keeps the estimate above the real count.
# [context]
# chars_per_token = 3.5
# max_tool_output_chars = 16000
#
# Exact sizes from the server's tokenizer (llama.cpp, vLLM): add to a profile with
# context_window:   token_counting = "server"

# Loop limits (shown with their defaults; 0 turns an optional check off). Any table value
# can also be set from the environment: AGENT_HARNESS_SET__ORCHESTRATOR__MAX_TOOL_CALLS_PER_TURN=16
# [orchestrator]
# max_model_attempts = 3
# max_tool_calls_per_turn = 32
# context_overflow_retries = 2
# context_overflow_shrink = 0.5

# HTTP API rate limit per key, and per-end-user quotas (0 = off / no limit)
# [api]
# rate_limit_per_minute = 120
# [user_quotas]
# max_runs_per_day = 50
# max_tokens_per_day = 2000000

[coding]
enabled = false
workspace = "."
execution_runtime = "docker"
approval_mode = "side_effects"
command_timeout_seconds = 120
max_output_bytes = 128000
enable_git_commit = true
enable_pull_requests = false

[coding.docker]
image = "python:3.12-slim"
network_enabled = false
cpus = 1.0
memory = "1g"
pids_limit = 256
read_only_root = true
run_as_host_user = true
# mode = "per_run"            # one warm container per run (docker exec), removed at the end
# max_lifetime_seconds = 3600 # a warm container never outlives this
