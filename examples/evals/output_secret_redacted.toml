# Feature: guardrails output guard. A secret-looking token in the model's answer is
# redacted before the reply is recorded ([guardrails.output] secrets = "redact").
name = "output_secret_redacted"
config = "../../models.toml"
prompt = "What is the deploy key?"

[[model]]
content = "The key is ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789 - keep it safe."

[expect]
output_not_contains = ["ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"]
events_include = ["guardrail_decided"]
