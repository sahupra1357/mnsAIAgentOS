# Offline validation gates for every push and pull request. No model server,
# network model access, or credentials are needed: tests use fakes and the
# scenario evals run scripted models.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: src
      # Keep runs hermetic: no user or enterprise settings layers.
      AGENT_HARNESS_USER_SETTINGS: /nonexistent/settings.toml
      AGENT_HARNESS_ENTERPRISE_SETTINGS: /nonexistent/settings.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint and type tools
        run: python -m pip install --upgrade pip "ruff==0.13.3" "mypy==1.19.0"
      - name: "Stage static: lint"
        run: ruff check src tests
      - name: "Stage static: types"
        run: MYPYPATH=src mypy src/agent_harness --ignore-missing-imports
      - name: "Stage static: compile"
        run: python -m compileall -q src tests examples
      - name: "Stage unit: tests"
        run: python -m unittest discover -s tests -v
      - name: "Stage scenarios: scripted evals"
        run: python -m agent_harness eval --config examples/models.toml examples/evals --report scenarios.json
      - name: "Stage benchmarks: harness self-check on sample data (scripted)"
        run: python -m unittest tests.test_bench -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-report-${{ matrix.python-version }}
          path: scenarios.json

  postgres:
    # The store conformance suite against a real PostgreSQL (service container).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness" --health-interval 5s --health-retries 10
    env:
      PYTHONPATH: src
      AGENT_HARNESS_USER_SETTINGS: /nonexistent/settings.toml
      AGENT_HARNESS_ENTERPRISE_SETTINGS: /nonexistent/settings.toml
      AGENT_HARNESS_TEST_POSTGRES_DSN: postgresql://harness:harness@127.0.0.1:5432/harness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the postgres extra
        run: python -m pip install --upgrade pip "psycopg[binary]>=3.1,<4"
      - name: "Stage unit: store and memory conformance on Postgres"
        run: python -m unittest tests.test_store_conformance tests.test_memory_backends -v
