default_model_profile = "llamacpp"

[routes]
fast = "llamacpp"
strong = "modal"
local = "ollama"

[models.llamacpp]
enabled = true
adapter = "llama_cpp"
model = "ggml-org/Qwen3.6-35B-A3B-GGUF:Q4_K_M"
endpoint = "http://127.0.0.1:9931/v1"
context_window = 16384
token_counting = "server"
timeout_seconds = 600
max_retries = 1
embedding_model = "nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0"
guard_model = "QuantFactory/Llama-Guard-3-1B-GGUF:Q4_K_M"

[models.llamacpp.parameters]
temperature = 0.2
max_tokens = 2048

[models.ollama]
enabled = true
adapter = "ollama"
model = "gpt-oss:20b"
endpoint = "http://127.0.0.1:11434/v1"
api_mode = "native"
context_window = 8192
timeout_seconds = 180
max_retries = 1
embedding_model = "nomic-embed-text"
guard_model = "llama-guard3:8b"

[models.ollama.parameters]
temperature = 0.2
num_predict = 1024

[models.modal]
enabled = false
adapter = "modal"
server = "vllm"
model = "Qwen/Qwen3.6-35B-A3B"
endpoint = "https://WORKSPACE--agent-harness-vllm-serve.modal.run/v1"
api_key_env = "MODAL_LLM_API_KEY"
timeout_seconds = 180
cold_start_timeout_seconds = 1200
max_retries = 1
context_window = 32768
token_counting = "server"
embedding_model = "nomic-ai/nomic-embed-text-v1.5"
embedding_endpoint = "https://WORKSPACE--agent-harness-vllm-embed-serve.modal.run/v1"
guard_model = "meta-llama/Llama-Guard-3-8B"
guard_endpoint = "https://WORKSPACE--agent-harness-vllm-guard-serve.modal.run/v1"

[models.modal.headers_env]
Modal-Key = "MODAL_PROXY_TOKEN_ID"
Modal-Secret = "MODAL_PROXY_TOKEN_SECRET"

[models.modal.parameters]
temperature = 0.2
max_tokens = 2048

[models.modal.pricing]
gpu_usd_per_second = 0.001261

[models.modal_shared]
enabled = false
adapter = "openai_compatible"
api_key_env = "MODAL_SHARED_TOKEN"
affinity_header = "Modal-Routing-Affinity-Key"
timeout_seconds = 180
max_retries = 3
retry_jitter = 0.2
context_window = 131072
token_counting = "estimate"
embedding_profile = "modal.embed"
guard_profile = "modal.guard"

[models.modal_shared.parameters]
temperature = 0.2
max_tokens = 16384
repetition_penalty = 1.05

[models.modal_shared.pricing]
input_usd_per_million_tokens = 0.30
cached_input_usd_per_million_tokens = 0.03
output_usd_per_million_tokens = 1.20

[orchestrator]
max_model_attempts = 3
max_tool_attempts = 3
max_identical_tool_calls = 5
max_refused_repeats = 2
max_tool_calls_per_turn = 32
context_overflow_retries = 2
context_overflow_shrink = 0.5
current_date_note = true
final_answer_on_last_step = true
final_answer_reserve_seconds = 120
max_answer_continuations = 2
max_cut_off_retries = 2
prefetch_with_hooks = true
reserve_tokens_per_run = 5000000
turn_max_steps = 200
turn_max_wall_seconds = 3600

[context]
chars_per_token = 3.0
high_water_ratio = 0.85
low_water_ratio = 0.60
max_tool_output_chars = 16000
default_window = 32768
stale_tool_output_chars = 1500
keep_recent_units = 4
min_fitted_output_chars = 2000

[summarization]
max_output_tokens = 1536
trigger_ratio = 0.70
keep_ratio = 0.35
style = "structured"
max_message_chars = 6000
parameters = { chat_template_kwargs = { enable_thinking = false } }

[project]
root = "cwd"
settings = false
claude_code = true
claude_skills = ["*"]
link_runs = true

[coding]
enabled = true
workspace = "."
execution_runtime = "local"
allow_local_execution = true
approval_mode = "side_effects"
command_timeout_seconds = 1800
enable_git_commit = true
enable_pull_requests = false
allowed_commands = ["*"]
forbidden_commands = ["chmod", "chown", "dd", "docker", "doas", "fdisk", "kill", "killall", "mkfs",
                      "mount", "nc", "netcat", "powershell", "pwsh", "reboot", "shutdown",
                      "sudo", "su", "umount", "wget", "zsh"]

[permissions]
mode = "bypass"
allow = ["read_file", "search_files", "git_status", "git_diff", "run_tests",
         "run_command(argv.0=pytest)",
         "run_command(argv.0=ls)", "run_command(argv.0=cat)", "run_command(argv.0=head)",
         "run_command(argv.0=wc)", "run_command(argv.0=find)"]
ask = ["read_file(path=*.env)", "run_command(argv.1=*.env)", "run_command(argv.2=*.env)",
       "run_command(argv.3=*.env)", "run_command(argv.4=*.env)"]
deny = ["run_command(argv.0=sudo)", "git_*(force=true)"]
edit_tools = ["apply_patch"]

[[hooks]]
name = "audit-pre-tool"
event = "pre_tool"
matcher = "*"
command = ["python3", ".agent-harness/hooks/audit_hook.py"]
timeout_seconds = 10

[[hooks]]
name = "audit-post-tool"
event = "post_tool"
matcher = "*"
command = ["python3", ".agent-harness/hooks/audit_hook.py"]
timeout_seconds = 10

[interaction]
ask_user = true
approval_timeout_seconds = 3600
question_timeout_seconds = 3600
on_timeout = "deny"

[tasks]
enabled = true

[subagents]
max_depth = 2
max_per_run = 6
max_parallel = 2

[[agents]]
name = "researcher"
description = "Answers one question about the codebase by searching and reading files. Read-only."
prompt_file = ".agent-harness/agents/researcher.md"
tools = ["read_file", "search_files", "search_documentation"]
max_steps = 12

[[agents]]
name = "reviewer"
description = "Reviews the current uncommitted changes and reports real problems, most severe first. Read-only."
prompt_file = ".agent-harness/agents/reviewer.md"
tools = ["git_status", "git_diff", "read_file", "search_files"]
max_steps = 12

[[agents]]
name = "test-runner"
description = "Runs the test suite and explains any failures with their likely cause. Cannot edit files."
prompt_file = ".agent-harness/agents/test-runner.md"
tools = ["run_tests", "read_file", "search_files"]
max_steps = 8

[planning]
mode = "auto"
auto_reminder_after_steps = 6
max_plan_steps = 20
max_replans = 2

[instructions]
enabled = true
files = ["~/.agent-harness/AGENTS.md", ".agent-harness/instructions/CHAT.md"]
subdirectories = true

[skills]
enabled = true
paths = [".agent-harness/skills"]

[templates]
paths = [".agent-harness/templates"]

[plugins]
directory = ".agent-harness/plugins"
enabled = ["security-review"]

[[tools]]
name = "text-tools"
kind = "python"
module = "text_tools:register"
path = ".agent-harness/tools"

[[tools]]
name = "json-tools"
kind = "python"
module = "json_tools:register"
path = ".agent-harness/sandbox_tools"
sandbox = "container"
image = "python:3.12-slim"
network = false

[[tools]]
name = "github_repo"
kind = "http"
method = "GET"
url = "https://api.github.com/repos/octocat/hello-world"
description = "Fetch public metadata of the example GitHub repository."
input_schema = { type = "object", properties = {} }

[[mcp_servers]]
name = "excalidraw"
transport = "http"
url = "https://mcp.excalidraw.com/mcp"
tools = ["read_me", "create_view"]
read_only = ["read_me", "create_view"]
trusted = ["read_me"]
sync_on_start = true

[web_fetch]
enabled = true
max_chars = 6000

[web_search]
enabled = true
api_key_env = "TAVILY_API_KEY"
max_results = 3
max_chars_per_result = 800

[memory]
namespace = "default"
search = "hybrid"
database = "~/.agent-harness/memory.sqlite3"
recall_limit = 5
recall_max_chars = 2000
auto_save_max_notes = 4
auto_save_max_output_tokens = 512
auto_save_parameters = { chat_template_kwargs = { enable_thinking = false } }

[artifacts]
enabled = true
directory = ".agent-harness/artifacts"
threshold_bytes = 16384

[tool_loading]
mode = "dynamic"
core = ["read_file", "search_files", "search_documentation", "apply_patch", "run_tests",
        "run_command", "git_status", "git_diff", "memory_search", "memory_write",
        "memory_update", "memory_forget",
        "load_skill", "web_fetch", "web_search", "previous_runs"]
max_loaded = 30
search_limit = 8

[guardrails]
enabled = true
refusal_message = "I can't help with that request."

[guardrails.input]
injection = "block"
prompt_extraction = "block"
hidden_characters = "redact"
encoded_payloads = "block"
pii = "allow"

[guardrails.output]
canary = "block"
secrets = "redact"
pii = "redact"

[guardrails.tools]
injection = "redact"
taint = true

[guardrails.model]
action = "flag"
parallel = true
timeout_seconds = 20

[network]
restrict_egress = true
allowed_hosts = ["api.tavily.com", "api.github.com", "github.com", "raw.githubusercontent.com",
                 "docs.python.org", "pypi.org", "en.wikipedia.org", "mcp.excalidraw.com",
                 "wttr.in", "*.open-meteo.com", "*.weather.gov", "*.weatherapi.com",
                 "*.timeanddate.com", "mausam.imd.gov.in"]

[redaction]
enabled = true

[langfuse]
enabled = true
content = "redacted"
sample_rate = 1.0
environment = "local"

[[quotas]]
tenant = "default"
max_runs_per_day = 500
max_tokens_per_day = 100000000
max_concurrent_runs = 8

[user_quotas]
max_runs_per_day = 200
max_concurrent_runs = 4

[api]
cors_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8080"]
rate_limit_per_minute = 240
rate_limit_burst = 40

[[api.keys]]
name = "me"
tenant = "default"
role = "admin"
key_env = "AGENT_HARNESS_API_KEY"

[notifications]
webhook_url = ""
